/* Volcengine-style professional cloud console design tokens */
/* Brand prefix: volcano */

:root {
  --volcano-background: #f8fafc;
  --volcano-foreground: #0f172a;
  --volcano-card: #ffffff;
  --volcano-card-foreground: #0f172a;
  --volcano-popover: #ffffff;

  --volcano-border: #e2e8f0;
  --volcano-input: #e2e8f0;
  --volcano-ring: #2563eb;

  --volcano-sidebar-background: #0f172a;

  --volcano-state-warning: #f59e0b;
  --volcano-state-warning-bg: #fffbeb;

  --volcano-radius-small: 4px;

  --volcano-font-primary: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --volcano-font-mono: "JetBrains Mono", "Fira Code", "SF Mono", Consolas, monospace;

  --volcano-shadow-1: 0 1px 2px 0 rgba(15, 23, 42, 0.05), 0 1px 1px 0 rgba(15, 23, 42, 0.03);
  --volcano-shadow-2: 0 8px 24px -8px rgba(15, 23, 42, 0.12);
  --volcano-shadow-3: 0 24px 60px -20px rgba(15, 23, 42, 0.22);

  --color-background: var(--volcano-background);
  --color-foreground: var(--volcano-foreground);
  --color-card: var(--volcano-card);
  --color-card-foreground: var(--volcano-card-foreground);

  --color-popover-foreground: var(--volcano-popover-foreground);
  --color-primary: var(--volcano-primary);
  --color-primary-foreground: var(--volcano-primary-foreground);
  --color-secondary: var(--volcano-muted);
  --color-secondary-foreground: var(--volcano-foreground);
  --color-muted: var(--volcano-muted);
  --color-muted-foreground: var(--volcano-muted-foreground);

  --color-destructive-foreground: var(--volcano-destructive-foreground);

  --color-input: var(--volcano-input);
  --color-ring: var(--volcano-ring);
  --radius-sm: var(--volcano-radius-small);
  --radius-md: var(--volcano-radius-medium);
  --radius-lg: var(--volcano-radius-large);

  --volcano-shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.5);
}

/* Typography classes */
.volcano-display {
  font-family: var(--volcano-font-primary);

  line-height: 1.02;
  font-weight: 600;
  letter-spacing: -0.03em;
}

.volcano-h1 {

  font-size: clamp(28px, 3.5vw, 48px);
  line-height: 1.1;
  font-weight: 600;
  letter-spacing: -0.02em;
}

.volcano-h2 {
  font-family: var(--volcano-font-primary);
  font-size: clamp(22px, 2.4vw, 32px);
  line-height: 1.2;
  font-weight: 600;
  letter-spacing: -0.015em;
}

.volcano-h3 {
  font-family: var(--volcano-font-primary);
  font-size: 20px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.volcano-body {
  font-family: var(--volcano-font-primary);
  font-size: 15px;
  line-height: 1.6;
  font-weight: 400;
}

.volcano-body-large {
  font-family: var(--volcano-font-primary);
  font-size: 18px;
  line-height: 1.55;
  font-weight: 400;
}

.volcano-caption {
  font-family: var(--volcano-font-primary);
  font-size: 13px;
  line-height: 1.5;
  font-weight: 400;
  letter-spacing: 0.005em;
}

.volcano-mono {
  font-family: var(--volcano-font-mono);
  font-size: 13px;
  line-height: 1.5;
  font-weight: 500;
}

/* Base reset */
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--volcano-font-primary);
  background-color: var(--volcano-background);
  color: var(--volcano-foreground);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

        <div>
          <h1 class="text-xl font-semibold text-foreground">导入集群</h1>
          <p class="mt-0.5 text-[13px] text-muted-foreground">K8S 多集群管理平台 · clusters</p>
        </div>
      </div>
    </div>

    <!-- Main scroll content -->
    <main class="flex-1 overflow-y-auto p-6 bg-background">
      <!-- Import form -->
      <div class="max-w-3xl mx-auto">
        <div class="bg-card rounded-[12px] shadow-[var(--volcano-shadow-1)] p-6 space-y-6" data-dom-id="import-form">
          <!-- Cluster name -->
          <div class="space-y-2">
            <label class="text-sm font-medium text-foreground" for="cluster-name">集群名称 <span class="text-destructive">*</span></label>
            <input id="cluster-name" type="text" placeholder="例如：prod-cluster-01" class="w-full px-3 py-2 rounded-md border border-border bg-background text-[13px] focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" />
          </div>

          <!-- Kubeconfig/API cert -->
          <div class="space-y-2">
            <label class="text-sm font-medium text-foreground" for="cluster-cert">Kubeconfig / API 证书</label>
            <div class="relative">
              <textarea id="cluster-cert" rows="10" placeholder="将 kubeconfig 内容粘贴到此处，或将文件拖拽到该区域" class="w-full px-3 py-2 rounded-md border border-border bg-background font-mono text-[13px] resize-none focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary"></textarea>
              <div class="absolute inset-0 pointer-events-none border-2 border-dashed border-primary/30 rounded-md flex flex-col items-center justify-center text-primary opacity-0 hover:opacity-100 transition-opacity bg-background/90">
                <i data-lucide="upload-cloud" class="w-8 h-8 mb-2"></i>
                <span class="text-[13px] font-medium">拖拽文件到此处上传</span>
              </div>
            </div>
          </div>

          <!-- API server URL -->
          <div class="space-y-2">
            <label class="text-sm font-medium text-foreground" for="api-server">API Server 地址</label>
            <input id="api-server" type="text" placeholder="https://kubernetes.default.svc:443" class="w-full px-3 py-2 rounded-md border border-border bg-background text-[13px] focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" />
          </div>

          <!-- Description -->
          <div class="space-y-2">
            <label class="text-sm font-medium text-foreground" for="description">描述 <span class="text-muted-foreground font-normal">（可选）</span></label>
            <textarea id="description" rows="3" placeholder="请输入集群描述" class="w-full px-3 py-2 rounded-md border border-border bg-background text-[13px] resize-none focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary"></textarea>
          </div>

          <!-- Action bar -->
          <div class="flex items-center justify-between pt-4 border-t border-border">
            <button type="button" class="px-4 py-2 rounded-md border border-border bg-background text-[13px] font-medium text-foreground hover:bg-muted transition-colors">测试连接</button>
            <div class="flex items-center gap-3">
              <a href="cluster-overview.html" data-dom-id="btn-cancel" class="text-[13px] font-medium text-muted-foreground hover:text-foreground transition-colors">取消</a>
              <button type="button" data-dom-id="btn-save-success" class="px-4 py-2 rounded-md bg-primary text-primary-foreground text-[13px] font-medium hover:bg-primary/90 transition-colors">保存并导入</button>
            </div>
          </div>
        </div>

        <!-- Connection test result -->
        <div class="mt-4 flex items-start gap-3 rounded-md px-4 py-3 text-[13px]" style="background-color: var(--volcano-state-success-bg); color: var(--volcano-state-success);" data-dom-id="connection-test">
          <i data-lucide="check-circle-2" class="w-4 h-4 mt-0.5 flex-shrink-0"></i>
          <div>
            <p class="font-medium">连接成功 · 版本 v1.28.4</p>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script>lucide.createIcons();</script>
</body>
</html>
