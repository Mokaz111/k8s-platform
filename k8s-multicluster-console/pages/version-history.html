    <style id="theme-vars">
/* Volcengine-style professional cloud console design tokens */
/* Brand prefix: volcano */

:root {
  --volcano-background: #f8fafc;
  --volcano-foreground: #0f172a;
  --volcano-card: #ffffff;
  --volcano-card-foreground: #0f172a;
  --volcano-popover: #ffffff;
  --volcano-popover-foreground: #0f172a;
  --volcano-primary: #2563eb;
  --volcano-primary-foreground: #ffffff;
  --volcano-muted: #f1f5f9;
  --volcano-muted-foreground: #64748b;
  --volcano-destructive: #ef4444;
  --volcano-destructive-foreground: #ffffff;
  --volcano-border: #e2e8f0;
  --volcano-input: #e2e8f0;
  --volcano-ring: #2563eb;

  --volcano-sidebar-background: #0f172a;
  --volcano-sidebar-foreground: #cbd5e1;
  --volcano-sidebar-primary: #2563eb;
  --volcano-sidebar-primary-foreground: #ffffff;
  --volcano-sidebar-accent: #1e293b;
  --volcano-sidebar-accent-foreground: #f8fafc;
  --volcano-sidebar-border: #1e293b;

  --volcano-state-success: #22c55e;
  --volcano-state-success-bg: #f0fdf4;
  --volcano-state-warning: #f59e0b;
  --volcano-state-warning-bg: #fffbeb;
  --volcano-state-error: #ef4444;
  --volcano-state-error-bg: #fef2f2;
  --volcano-state-info: #3b82f6;
  --volcano-state-info-bg: #eff6ff;

  --volcano-radius-small: 4px;
  --volcano-radius-medium: 8px;
  --volcano-radius-large: 12px;

  --volcano-font-primary: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --volcano-font-mono: "JetBrains Mono", "Fira Code", "SF Mono", Consolas, monospace;

  --volcano-shadow-1: 0 1px 2px 0 rgba(15, 23, 42, 0.05), 0 1px 1px 0 rgba(15, 23, 42, 0.03);
  --volcano-shadow-2: 0 8px 24px -8px rgba(15, 23, 42, 0.12);
  --volcano-shadow-3: 0 24px 60px -20px rgba(15, 23, 42, 0.22);

  /* Semantic aliases */
  --color-background: var(--volcano-background);
  --color-foreground: var(--volcano-foreground);
  --color-card: var(--volcano-card);
  --color-card-foreground: var(--volcano-card-foreground);
  --color-popover: var(--volcano-popover);
  --color-popover-foreground: var(--volcano-popover-foreground);
  --color-primary: var(--volcano-primary);
  --color-primary-foreground: var(--volcano-primary-foreground);
  --color-secondary: var(--volcano-muted);
  --color-secondary-foreground: var(--volcano-foreground);
  --color-muted: var(--volcano-muted);
  --color-muted-foreground: var(--volcano-muted-foreground);
  --color-accent: var(--volcano-primary);
  --color-accent-foreground: var(--volcano-primary-foreground);
  --color-destructive: var(--volcano-destructive);
  --color-destructive-foreground: var(--volcano-destructive-foreground);
  --color-border: var(--volcano-border);
  --color-input: var(--volcano-input);
  --color-ring: var(--volcano-ring);
  --radius-sm: var(--volcano-radius-small);
  --radius-md: var(--volcano-radius-medium);
  --radius-lg: var(--volcano-radius-large);
}

.dark {
  --volcano-background: #0b1120;
  --volcano-foreground: #f8fafc;
  --volcano-card: #151d2e;
  --volcano-card-foreground: #f8fafc;
  --volcano-popover: #151d2e;
  --volcano-popover-foreground: #f8fafc;
  --volcano-primary: #3b82f6;
  --volcano-primary-foreground: #ffffff;
  --volcano-muted: #1e293b;
  --volcano-muted-foreground: #94a3b8;
  --volcano-destructive: #ef4444;
  --volcano-destructive-foreground: #ffffff;
  --volcano-border: #1e293b;
  --volcano-input: #1e293b;
  --volcano-ring: #3b82f6;

  --volcano-sidebar-background: #020617;
  --volcano-sidebar-foreground: #94a3b8;
  --volcano-sidebar-primary: #3b82f6;
  --volcano-sidebar-primary-foreground: #ffffff;
  --volcano-sidebar-accent: #1e293b;
  --volcano-sidebar-accent-foreground: #f8fafc;
  --volcano-sidebar-border: #1e293b;

  --volcano-state-success: #4ade80;
  --volcano-state-success-bg: #064e3b;
  --volcano-state-warning: #fbbf24;
  --volcano-state-warning-bg: #78350f;
  --volcano-state-error: #f87171;
  --volcano-state-error-bg: #7f1d1d;
  --volcano-state-info: #60a5fa;
  --volcano-state-info-bg: #1e3a8a;

  --volcano-shadow-1: 0 1px 2px 0 rgba(0, 0, 0, 0.2), 0 1px 1px 0 rgba(0, 0, 0, 0.15);
  --volcano-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.35);
  --volcano-shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.5);
}

/* Typography classes */
.volcano-display {
  font-family: var(--volcano-font-primary);
  font-size: clamp(40px, 6vw, 88px);
  line-height: 1.02;
  font-weight: 600;
  letter-spacing: -0.03em;
}

.volcano-h1 {
  font-family: var(--volcano-font-primary);
  font-size: clamp(28px, 3.5vw, 48px);
  line-height: 1.1;
  font-weight: 600;
  letter-spacing: -0.02em;
}

.volcano-h2 {
  font-family: var(--volcano-font-primary);
  font-size: clamp(22px, 2.4vw, 32px);
  line-height: 1.2;
  font-weight: 600;
  letter-spacing: -0.015em;
}

.volcano-h3 {
  font-family: var(--volcano-font-primary);
  font-size: 20px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.volcano-body {
  font-family: var(--volcano-font-primary);
  font-size: 15px;
  line-height: 1.6;
  font-weight: 400;
}

.volcano-body-large {
  font-family: var(--volcano-font-primary);
  font-size: 18px;
  line-height: 1.55;
  font-weight: 400;
}

.volcano-caption {
  font-family: var(--volcano-font-primary);
  font-size: 13px;
  line-height: 1.5;
  font-weight: 400;
  letter-spacing: 0.005em;
}

.volcano-mono {
  font-family: var(--volcano-font-mono);
  font-size: 13px;
  line-height: 1.5;
  font-weight: 500;
}

/* Base reset */
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--volcano-font-primary);
  background-color: var(--volcano-background);
  color: var(--volcano-foreground);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

<body class="min-h-screen font-sans antialiased">
<!-- Shared project shell for K8S multi-cluster admin console -->
<!-- Mutable slots: pageTitle, activeNavKey, mainContent, pageActions -->
<div class="flex h-screen w-full overflow-hidden bg-background text-foreground" id="app-shell">
  <!-- Sidebar -->
  <aside class="flex-shrink-0 flex flex-col w-[240px] bg-[var(--volcano-sidebar-background)] text-[var(--volcano-sidebar-foreground)] border-r border-[var(--volcano-sidebar-border)]">
    <!-- Logo -->
    <div class="flex items-center h-14 px-4 border-b border-[var(--volcano-sidebar-border)]">
      <div class="flex items-center gap-2.5">
        <div class="w-7 h-7 rounded-md bg-primary flex items-center justify-center text-primary-foreground">
          <i data-lucide="hexagon" class="w-4 h-4"></i>
        </div>
        <span class="font-semibold text-[15px] text-[var(--volcano-sidebar-accent-foreground)]">K8S Console</span>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 overflow-y-auto py-3 px-2 space-y-1" id="sidebar-nav">
      <a href="cluster-overview.html" data-nav-key="overview" data-dom-id="nav-overview" class="flex items-center gap-3 px-3 py-2 rounded-md text-[13px] font-medium text-[var(--volcano-sidebar-foreground)] hover:bg-[var(--volcano-sidebar-accent)] hover:text-[var(--volcano-sidebar-accent-foreground)] transition-colors">
        <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
        <span>概览</span>
      </a>
      <a href="cluster-import.html" data-nav-key="clusters" data-dom-id="nav-clusters" class="flex items-center gap-3 px-3 py-2 rounded-md text-[13px] font-medium text-[var(--volcano-sidebar-foreground)] hover:bg-[var(--volcano-sidebar-accent)] hover:text-[var(--volcano-sidebar-accent-foreground)] transition-colors">
        <i data-lucide="server" class="w-4 h-4"></i>
        <span>集群管理</span>
      </a>
      <a href="resource-list.html" data-nav-key="resources" data-dom-id="nav-resources" data-active="true" class="flex items-center gap-3 px-3 py-2 rounded-md text-[13px] font-medium bg-[var(--volcano-sidebar-primary)] text-[var(--volcano-sidebar-primary-foreground)] transition-colors">
        <i data-lucide="boxes" class="w-4 h-4"></i>
        <span>资源管理</span>
      </a>
      <a href="backup-list.html" data-nav-key="backups" data-dom-id="nav-backups" class="flex items-center gap-3 px-3 py-2 rounded-md text-[13px] font-medium text-[var(--volcano-sidebar-foreground)] hover:bg-[var(--volcano-sidebar-accent)] hover:text-[var(--volcano-sidebar-accent-foreground)] transition-colors">
        <i data-lucide="archive" class="w-4 h-4"></i>
        <span>备份管理</span>
      </a>
      <a href="plugin-center.html" data-nav-key="plugins" data-dom-id="nav-plugins" class="flex items-center gap-3 px-3 py-2 rounded-md text-[13px] font-medium text-[var(--volcano-sidebar-foreground)] hover:bg-[var(--volcano-sidebar-accent)] hover:text-[var(--volcano-sidebar-accent-foreground)] transition-colors">
        <i data-lucide="plug" class="w-4 h-4"></i>
        <span>插件中心</span>
      </a>
      <a href="#" data-nav-key="settings" data-dom-id="nav-settings" class="flex items-center gap-3 px-3 py-2 rounded-md text-[13px] font-medium text-[var(--volcano-sidebar-foreground)] hover:bg-[var(--volcano-sidebar-accent)] hover:text-[var(--volcano-sidebar-accent-foreground)] transition-colors">
        <i data-lucide="settings" class="w-4 h-4"></i>
        <span>系统设置</span>
      </a>
    </nav>

    <!-- Sidebar footer -->
    <div class="px-3 py-3 border-t border-[var(--volcano-sidebar-border)]">
      <div class="flex items-center gap-2 px-2 py-1.5 rounded-md text-[12px] text-[var(--volcano-sidebar-foreground)] opacity-80">
        <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
        <span>v1.0.0 · Plugin Ready</span>
      </div>
    </div>
  </aside>

  <!-- Main area -->
  <div class="flex-1 flex flex-col min-w-0 bg-background">
    <!-- Top header -->
    <header class="flex-shrink-0 h-14 bg-card border-b border-border flex items-center justify-between px-4 z-10">
      <div class="flex items-center gap-3">
        <!-- Cluster selector -->
        <div class="relative">
          <button data-dom-id="cluster-selector" class="flex items-center gap-2 px-3 py-1.5 rounded-md border border-border bg-background hover:bg-muted transition-colors text-[13px]">
            <i data-lucide="database" class="w-3.5 h-3.5 text-muted-foreground"></i>
            <span class="font-medium">prod-cluster-01</span>
            <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-muted-foreground"></i>
          </button>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <!-- Global search -->
        <button data-dom-id="global-search" class="flex items-center gap-2 px-3 py-1.5 rounded-md border border-border bg-background hover:bg-muted transition-colors text-[13px] text-muted-foreground">
          <i data-lucide="search" class="w-3.5 h-3.5"></i>
          <span>搜索资源...</span>
          <kbd class="hidden sm:inline-flex px-1.5 py-0.5 rounded bg-muted text-[11px] border border-border">⌘K</kbd>
        </button>
        <!-- Notifications -->
        <button data-dom-id="notifications" class="relative p-2 rounded-md border border-border bg-background hover:bg-muted transition-colors">
          <i data-lucide="bell" class="w-4 h-4 text-muted-foreground"></i>
          <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-destructive"></span>
        </button>
        <!-- User avatar -->
        <button data-dom-id="user-avatar" class="flex items-center gap-2 px-2 py-1.5 rounded-md hover:bg-muted transition-colors">
          <div class="w-7 h-7 rounded-full bg-primary/10 text-primary flex items-center justify-center text-[12px] font-semibold">SA</div>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-muted-foreground"></i>
        </button>
      </div>
    </header>

    <!-- Page title bar -->
    <div class="flex-shrink-0 bg-card border-b border-border px-6 py-4">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-xl font-semibold text-foreground">版本历史</h1>
          <p class="mt-0.5 text-[13px] text-muted-foreground">K8S 多集群管理平台 · 资源管理</p>
        </div>
        <a href="resource-edit.html" data-dom-id="btn-back-to-edit" class="inline-flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium bg-primary text-primary-foreground hover:bg-primary/90 transition-colors">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
          <span>返回编辑</span>
        </a>
      </div>
    </div>

    <!-- Main scroll content -->
    <main class="flex-1 overflow-hidden p-6 bg-background">
      <div class="h-full max-w-[1600px] mx-auto flex flex-col gap-4">
        <!-- Version snapshot selector -->
        <div class="flex-shrink-0 flex items-center gap-3">
          <label for="version-select" class="text-sm font-medium text-foreground">选择版本快照</label>
          <select id="version-select" class="h-9 min-w-[220px] rounded-md border border-border bg-card px-3 py-1.5 text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
            <option value="v1.5">v1.5（当前）</option>
            <option value="v1.4">v1.4</option>
            <option value="v1.3">v1.3</option>
            <option value="v1.2">v1.2</option>
            <option value="v1.1">v1.1</option>
          </select>
          <span class="text-xs text-muted-foreground">系统仅保留最近 5 个版本</span>
        </div>

        <!-- Side-by-side full YAML diff -->
        <div class="flex-1 min-h-0 flex flex-col lg:flex-row gap-4">
          <div class="flex-1 min-w-0 flex flex-col bg-card border border-border rounded-xl shadow-sm overflow-hidden">
            <div class="px-4 py-3 border-b border-border flex items-center justify-between bg-muted/30">
              <h2 class="text-base font-semibold text-foreground">当前版本 <span class="font-mono text-sm">v1.5</span></h2>
              <span class="text-[11px] px-2 py-0.5 rounded-full bg-primary text-primary-foreground">当前</span>
            </div>
            <div id="left-yaml" class="flex-1 overflow-auto p-4 text-[13px] font-mono leading-relaxed"></div>
          </div>
          <div class="flex-1 min-w-0 flex flex-col bg-card border border-border rounded-xl shadow-sm overflow-hidden">
            <div class="px-4 py-3 border-b border-border flex items-center justify-between bg-muted/30">
              <h2 class="text-base font-semibold text-foreground">对比版本 <span class="font-mono text-sm" id="right-version-label">v1.4</span></h2>
              <span class="text-[11px] px-2 py-0.5 rounded-full bg-muted text-muted-foreground">已选中</span>
            </div>
            <div id="right-yaml" class="flex-1 overflow-auto p-4 text-[13px] font-mono leading-relaxed"></div>
          </div>
        </div>

        <!-- Rollback action -->
        <div class="flex-shrink-0 px-4 py-3 border border-border bg-card rounded-xl flex items-center justify-between gap-4">
          <div class="text-sm text-muted-foreground">
            已选择对比版本 <span id="selected-version-text" class="font-medium text-foreground">v1.4</span>
          </div>
          <button id="btn-rollback" type="button" class="inline-flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium bg-primary text-primary-foreground hover:bg-primary/90 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
            <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
            <span>回滚到选中版本</span>
          </button>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
(function () {
  'use strict';
  const currentVersion = 'v1.5';

  const snapshots = {
    'v1.5': `apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-gateway
  namespace: default
  labels:
    app: web-gateway
    tier: backend
spec:
  replicas: 5
  selector:
    matchLabels:
      app: web-gateway
  template:
    metadata:
      labels:
        app: web-gateway
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
    spec:
      containers:
        - name: nginx
          image: nginx:1.23.4
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: 2000m
              memory: 512Mi
          env:
            - name: APP_ENV
              value: production
          livenessProbe:
            initialDelaySeconds: 60
          readinessProbe:
            periodSeconds: 10
service:
  type: NodePort
  port: 8080
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 0`,
    'v1.4': `apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-gateway
  namespace: default
  labels:
    app: web-gateway
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-gateway
  template:
    metadata:
      labels:
        app: web-gateway
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
    spec:
      containers:
        - name: nginx
          image: nginx:1.21.6
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
          env:
            - name: APP_ENV
              value: staging
          livenessProbe:
            initialDelaySeconds: 30
service:
  type: ClusterIP
  port: 80
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 0`,
    'v1.3': `apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-gateway
  namespace: default
  labels:
    app: web-gateway
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-gateway
  template:
    metadata:
      labels:
        app: web-gateway
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
    spec:
      containers:
        - name: nginx
          image: nginx:1.21.6
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
          env:
            - name: APP_ENV
              value: staging
          livenessProbe:
            initialDelaySeconds: 30
service:
  type: ClusterIP
  port: 80
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 0`,
    'v1.2': `apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-gateway
  namespace: default
  labels:
    app: web-gateway
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-gateway
  template:
    metadata:
      labels:
        app: web-gateway
        tier: frontend
      annotations:
        prometheus.io/scrape: "true"
    spec:
      containers:
        - name: nginx
          image: nginx:1.21.6
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
          env:
            - name: APP_ENV
              value: staging
          livenessProbe:
            initialDelaySeconds: 30
service:
  type: ClusterIP
  port: 80
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 0`,
    'v1.1': `apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-gateway
  namespace: default
  labels:
    app: web-gateway
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-gateway
  template:
    metadata:
      labels:
        app: web-gateway
        tier: frontend
      annotations:
        prometheus.io/scrape: "true"
    spec:
      containers:
        - name: nginx
          image: nginx:1.21.6
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: 1000m
              memory: 256Mi
          env:
            - name: APP_ENV
              value: staging
          livenessProbe:
            initialDelaySeconds: 30
service:
  type: ClusterIP
  port: 80
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 0`
  };

  const versionSelect = document.getElementById('version-select');
  const leftYaml = document.getElementById('left-yaml');
  const rightYaml = document.getElementById('right-yaml');
  const rightVersionLabel = document.getElementById('right-version-label');
  const selectedText = document.getElementById('selected-version-text');
  const rollbackBtn = document.getElementById('btn-rollback');

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function compareLines(left, right) {
    const max = Math.max(left.length, right.length);
    const leftMarks = new Array(left.length).fill('same');
    const rightMarks = new Array(right.length).fill('same');
    for (let i = 0; i < max; i++) {
      if (i >= left.length) {
        rightMarks[i] = 'added';
      } else if (i >= right.length) {
        leftMarks[i] = 'removed';
      } else if (left[i] !== right[i]) {
        leftMarks[i] = 'removed';
        rightMarks[i] = 'added';
      }
    }
    return { leftMarks, rightMarks };
  }

  function renderLines(lines, marks) {
    return lines.map(function (line, i) {
      const mark = marks[i] || 'same';
      let cls = 'text-foreground';
      if (mark === 'removed') cls = 'bg-[var(--volcano-state-error-bg)] text-[var(--volcano-state-error)]';
      if (mark === 'added') cls = 'bg-[var(--volcano-state-success-bg)] text-[var(--volcano-state-success)]';
      return '<div class="px-1 ' + cls + '">' + escapeHtml(line || ' ') + '</div>';
    }).join('');
  }

  function renderDiff(version) {
    const leftLines = (snapshots[currentVersion] || '').split('\n');
    const rightLines = (snapshots[version] || '').split('\n');
    const { leftMarks, rightMarks } = compareLines(leftLines, rightLines);
    leftYaml.innerHTML = renderLines(leftLines, leftMarks);
    rightYaml.innerHTML = renderLines(rightLines, rightMarks);
  }

  function selectVersion(version) {
    renderDiff(version);
    rightVersionLabel.textContent = version;
    selectedText.textContent = version;
    rollbackBtn.disabled = version === currentVersion;
  }

  versionSelect.addEventListener('change', function () {
    selectVersion(versionSelect.value);
  });

  versionSelect.value = 'v1.4';
  selectVersion('v1.4');
})();
</script>
<script>lucide.createIcons();</script>
</body>
